[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzyxai-h10-c2"
version = "0.1.0"
description = "Leakage-resistant preconfirmatory workflow for H10-C2a and H10-C2b."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "matplotlib>=3.7"]

[project.scripts]
h10-c2 = "h10_c2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

