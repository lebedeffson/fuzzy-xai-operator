name: Model replacement route revalidation
on:
  push:
    branches:
      - research/model-replacement-revalidation-20261115
  pull_request:
    paths:
      - 'experiments/model_replacement_revalidation.py'
      - 'experiments/model_replacement_revalidation_protocol_v1.json'
      - '.github/workflows/model-replacement-revalidation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run controlled model replacement protocol
        run: python experiments/model_replacement_revalidation.py --output-dir model_replacement_results
      - name: Check evidence and limitations
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          p = Path('model_replacement_results')
          x = json.loads((p / 'summary.json').read_text())
          assert x['status'] == 'DEVELOPMENT_ONLY_NONBLINDED'
          assert x['n_fitted_pairs'] == 9
          assert x['n_distinct_test_predictions'] == 1530
          assert x['n_status_records'] == 6120
          expected = {
              'original_clean': 'certified',
              'stale_route_after_real_model_replacement': 'rejected',
              'recomputed_route_after_model_replacement': 'certified',
              'missing_prediction_witness': 'insufficient_evidence',
          }
          for scenario, status in expected.items():
              row = x['by_scenario'][scenario]
              assert row['n'] == row['same_evidence_equal'] == 1530
              assert row['statuses'] == {status: 1530}
          with (p / 'model_replacement_cases.csv').open() as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 6120
          assert all(r['first_finding'] == 'REFERENCE_MISMATCH'
                     for r in rows if r['scenario'] == 'stale_route_after_real_model_replacement')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-replacement-revalidation-${{ matrix.python-version }}
          path: model_replacement_results/
