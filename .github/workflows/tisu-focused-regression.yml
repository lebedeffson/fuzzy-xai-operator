name: TISU focused scientific regression
on:
  pull_request:
    paths:
      - "framework/fuzzyxai/fuzzyxai/core/composition.py"
      - "framework/fuzzyxai/fuzzyxai/core/strict_composition.py"
      - "framework/fuzzyxai/fuzzyxai/core/trust_evaluator.py"
      - "framework/fuzzyxai/tests/test_tisu_core_safety_regression.py"
      - "framework/fuzzyxai/tests/test_tisu_strict_composition.py"
      - ".github/workflows/tisu-focused-regression.yml"
  workflow_dispatch:
jobs:
  test-core:
    name: TISU regression Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run compositional correctness regression tests
        run: |
          python -m pytest -q \
            framework/fuzzyxai/tests/test_tisu_core_safety_regression.py \
            framework/fuzzyxai/tests/test_tisu_strict_composition.py \
            framework/fuzzyxai/tests/test_composition.py \
            framework/fuzzyxai/tests/test_composition_well_defined.py \
            framework/fuzzyxai/tests/test_semantic_disagreement_pseudometric.py
