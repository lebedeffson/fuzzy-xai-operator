name: ML single-transform source-chain regression

on:
  push:
    branches:
      - research/ml-transform-chain-20261112
  pull_request:
    paths:
      - "framework/fuzzyxai/fuzzyxai/transform_provenance.py"
      - "framework/fuzzyxai/fuzzyxai/ml_observer.py"
      - "tests/test_ml_transform_chain.py"
      - "tests/test_ml_transform_chain_benchmark.py"
      - "experiments/ml_transform_chain_benchmark.py"
      - "experiments/ml_transform_chain_protocol_v1.json"
      - ".github/workflows/ml-transform-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-transform-chain-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scoped development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Data, training, target, transformation, output and public API tests
        run: |
          python -m pytest -q \
            tests/test_ml_transform_chain.py \
            tests/test_ml_transform_chain_benchmark.py \
            tests/test_ml_output_provenance.py \
            tests/test_ml_observer_end_to_end.py \
            tests/test_ml_output_witness_benchmark.py \
            tests/test_ml_target_fit_witness.py \
            tests/test_ml_target_fit_benchmark.py \
            tests/test_fit_provenance.py \
            tests/test_ml_fit_source_witness_benchmark.py \
            tests/test_ml_lifecycle_observer.py \
            tests/test_ml_lifecycle_benchmark.py \
            tests/test_public_framework_api.py \
            tests/test_observer_no_cyclic_dependency.py
      - name: Reproduce four-pipeline observed transform comparison
        run: python -m experiments.ml_transform_chain_benchmark > ml_transform_chain_result.json
      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: ml-transform-chain-${{ matrix.python-version }}
          path: ml_transform_chain_result.json
      - name: Ruff
        run: |
          ruff check framework/fuzzyxai/fuzzyxai/transform_provenance.py \
            framework/fuzzyxai/fuzzyxai/ml_observer.py \
            tests/test_ml_transform_chain.py \
            tests/test_ml_transform_chain_benchmark.py \
            experiments/ml_transform_chain_benchmark.py
