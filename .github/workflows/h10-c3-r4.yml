name: H10-C3 R4

on:
  push:
    branches:
      - fix/h10-c3-sealed-isolation-v23.3
  pull_request:

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest ruff PyYAML cryptography
      - run: make h10-c3-r4-test H10_C3_PYTHON=python
