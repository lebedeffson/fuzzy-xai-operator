name: ML lifecycle observer read-only regression

on:
  push:
    branches:
      - research/ml-lifecycle-observer-readonly-20261112
  pull_request:
    paths:
      - "framework/fuzzyxai/fuzzyxai/ml_observer.py"
      - "tests/test_ml_lifecycle_observer.py"
      - ".github/workflows/ml-lifecycle-observer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-lifecycle-observer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install framework development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test read-only ML lifecycle observer
        run: python -m pytest -q tests/test_ml_lifecycle_observer.py
      - name: Lint audit code and tests
        run: ruff check framework/fuzzyxai/fuzzyxai/ml_observer.py tests/test_ml_lifecycle_observer.py
