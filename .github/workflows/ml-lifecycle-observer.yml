name: ML lifecycle observer read-only regression

on:
  push:
    branches:
      - research/ml-lifecycle-observer-readonly-20261112
  pull_request:
    paths:
      - "framework/fuzzyxai/fuzzyxai/ml_observer.py"
      - "tests/test_ml_lifecycle_observer.py"
      - "tests/test_ml_lifecycle_benchmark.py"
      - "experiments/ml_lifecycle_observer_benchmark.py"
      - "experiments/ml_lifecycle_development_protocol_v1.json"
      - ".github/workflows/ml-lifecycle-observer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-lifecycle-observer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install framework development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test read-only ML lifecycle observer
        run: python -m pytest -q tests/test_ml_lifecycle_observer.py tests/test_ml_lifecycle_benchmark.py tests/test_public_framework_api.py tests/test_observer_no_cyclic_dependency.py
      - name: Run predeclared real-pipeline developmental comparison
        run: python -m experiments.ml_lifecycle_observer_benchmark > ml_lifecycle_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: ml-lifecycle-benchmark-${{ matrix.python-version }}
          path: ml_lifecycle_benchmark.json
      - name: Lint audit code, benchmark and tests
        run: |
          ruff check framework/fuzzyxai/fuzzyxai/ml_observer.py tests/test_ml_lifecycle_observer.py \
            experiments/ml_lifecycle_observer_benchmark.py tests/test_ml_lifecycle_benchmark.py
