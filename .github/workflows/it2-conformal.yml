name: FuzzyXAI IT2 + split conformal validation

on:
  push:
    branches: [chapter6-ophthalmology]
    paths:
      - 'framework/fuzzyxai/fuzzyxai/it2_conformal.py'
      - 'framework/fuzzyxai/fuzzyxai/runtime.py'
      - 'framework/fuzzyxai/fuzzyxai/evidence/graph.py'
      - 'framework/fuzzyxai/fuzzyxai/__init__.py'
      - 'tests/test_it2_conformal.py'
      - 'docs/IT2_CONFORMAL_RU.md'
      - '.github/workflows/it2-conformal.yml'
  workflow_dispatch:

jobs:
  controlled-calibration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual FuzzyXAI
        run: python -m pip install -e ".[dev]"
      - name: Exercise finite-sample quantiles, provenance and conservative runtime policy
        run: python -m pytest -q tests/test_it2_conformal.py tests/test_it2_runtime_adapter.py tests/test_it2_conformal_experiment.py
      - name: Held-out empirical WDBC conformal / Type-1 comparison
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m experiments.doctoral_it2_conformal \
            --out reports/chapter5/it2_conformal --bootstrap 16 \
            --seeds 17 42 73 123 2026
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("reports/chapter5/it2_conformal")
          checks = json.loads((root / "manifest_sha256.json").read_text())["files"]
          for filename, digest in checks.items():
              if hashlib.sha256((root / filename).read_bytes()).hexdigest() != digest:
                  raise AssertionError(f"Evidence integrity mismatch: {filename}")
          print("empirical WDBC evidence manifest: PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: it2-conformal-wdbc-py${{ matrix.python-version }}-${{ github.sha }}
          path: reports/chapter5/it2_conformal/
          if-no-files-found: warn
          retention-days: 14
