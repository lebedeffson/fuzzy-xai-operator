name: H10-C7R R10 causal retrieval

on:
  push:
    branches:
      - feat/h10-c7r-r10-causal-retrieval
  pull_request:
    paths:
      - "framework/fuzzyxai/fuzzyxai/experiments/h10_c5c_runtime.py"
      - "framework/fuzzyxai/fuzzyxai/experiments/h10_c7r_r10.py"
      - "framework/fuzzyxai/fuzzyxai/repository_diagnostics/**"
      - "protocol/h10_c7r_r10/**"
      - "scripts/ch4_revision/*h10_c7r_r10*"
      - "scripts/ch4_revision/collect_h10_c7r_runtime.py"
      - "tests/h10_c7/test_r10_causal_retrieval.py"
      - ".github/workflows/h10-c7r-r10.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONPATH: "experiments/h10_c3/src:framework/fuzzyxai:."
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install ".[dev,evidence,lightgbm]"
      - name: Focused R10 checks
        run: make h10-c7r-r10-test H10_C3_PYTHON=python
      - name: Full regression
        run: python -m pytest -q
