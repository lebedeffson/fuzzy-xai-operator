name: H10 v19 audit

on:
  push:
    branches:
      - feat/h10-audit-confirmatory-v19
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas scikit-learn matplotlib PyYAML pytest ruff
      - name: Ruff
        run: python -m ruff check framework/fuzzyxai/fuzzyxai/audit_h10 baselines/h10 experiments/h10 tests/h10
      - name: H10 unit, baseline independence and oracle independence
        env:
          PYTHONPATH: framework/fuzzyxai:.
        run: python -m pytest tests/h10 -q
      - name: Methodology preflight
        env:
          PYTHONPATH: framework/fuzzyxai:.
        run: python -m experiments.h10.audit_methodology
      - name: Frozen-output reproduction without vault opening
        env:
          PYTHONPATH: framework/fuzzyxai:.
        run: make reproduce-h10 H10_PYTHON=python
      - name: Private payload guard
        run: |
          if git ls-files | grep -E '(^|/)(\.h10_v19_private|.*label_vault.*|.*\.key$)'; then
            echo "Private H10 payload is tracked" >&2
            exit 1
          fi
