name: TISU typed F0 composition

on:
  pull_request:
    paths:
      - ".github/workflows/tisu-typed-f0.yml"
      - "benchmarks/tisu_composition_validation.py"
      - "framework/fuzzyxai/fuzzyxai/core/composition_checked.py"
      - "framework/fuzzyxai/fuzzyxai/__init__.py"
      - "framework/fuzzyxai/operators_manifest.yaml"
      - "tests/test_tisu_checked_composition.py"
      - "tests/test_public_framework_api.py"
  workflow_dispatch:

jobs:
  verified-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install published-package dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" build "ruff==0.15.19"
      - name: Lint changed implementation and tests
        run: |
          python -m ruff check framework/fuzzyxai/fuzzyxai/core/composition_checked.py benchmarks/tisu_composition_validation.py tests/test_tisu_checked_composition.py
      - name: Check API, manifest and legacy compose compatibility
        run: |
          python -m pytest -q tests/test_tisu_checked_composition.py tests/test_composition.py tests/test_public_framework_api.py::test_operator_manifest_is_complete_and_resolvable
      - name: Rerun the held-out controlled intervention matrix
        run: |
          python benchmarks/tisu_composition_validation.py --out-dir /tmp/tisu-validation
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/tisu-validation/experiment_report.json').read_text())
          assert report['config']['intervention_types'] == 20
          assert report['config']['intervention_pairs'] == 2860
          assert report['totals']['checked']['correct_status'] == 2860
          assert report['totals']['typed_only']['correct_status'] == 2438
          PY
      - name: Validate installable wheel public export
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c "from fuzzyxai import compose_checked, MembershipSpec, OriginRecord, CompositionPolicy; print('typed-wheel-import: PASS')"
