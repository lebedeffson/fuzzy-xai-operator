name: ECG exact core review assessment
on:
  push:
    branches: [research/ecg-operator-review-20261126]
    paths:
      - '.github/workflows/ecg-exact-operator-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  ECG_NUM_THREADS: '4'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  PYTHONUNBUFFERED: '1'
  DATA_ROOT: ${{ github.workspace }}/.ptbxl-data
jobs:
  exact-core-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen evaluation dependencies
        run: |
          python -m pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.6.1 wfdb==4.2.0 matplotlib==3.9.4 PyYAML==6.0.2
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Restore verified PTB-XL preparation
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45779528570
          name: ptbxl-prepared-verified
          path: ${{ env.DATA_ROOT }}/ecg/ptb-xl-1.0.3/prepared/
      - name: Restore all three verified trained checkpoints
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45779528570
          pattern: ecg-retrained-*
          path: ${{ runner.temp }}/ecg-runs
          merge-multiple: true
      - name: Restore completed full public explanations
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45779528570
          name: ecg-independent-xai
          path: ${{ runner.temp }}/ecg-xai
      - name: Verify equivalence and complete the cohort comparison
        run: |
          python -m chapter6_medical_validation.ecg_ptbxl.scripts.evaluate_exact_operator_review --data-root "$DATA_ROOT" --runs "$RUNNER_TEMP/ecg-runs" --archive "$RUNNER_TEMP/ecg-xai" --out "$RUNNER_TEMP/ecg-review"
      - name: Preserve audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecg-exact-core-review
          path: ${{ runner.temp }}/ecg-review/
          retention-days: 90
          if-no-files-found: warn
