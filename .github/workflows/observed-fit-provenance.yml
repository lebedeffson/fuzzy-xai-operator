name: Witnessed fit provenance regression

on:
  push:
    branches:
      - research/ml-observed-fit-events-20261112
  pull_request:
    paths:
      - "framework/fuzzyxai/fuzzyxai/fit_provenance.py"
      - "framework/fuzzyxai/fuzzyxai/ml_observer.py"
      - "tests/test_fit_provenance.py"
      - "tests/test_ml_fit_source_witness_benchmark.py"
      - "experiments/ml_fit_source_witness_benchmark.py"
      - "experiments/ml_fit_source_witness_protocol_v1.json"
      - "tests/test_ml_lifecycle_observer.py"
      - "tests/test_ml_lifecycle_benchmark.py"
      - ".github/workflows/observed-fit-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observed-fit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install framework and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Focused fit provenance and existing observer regression
        run: |
          python -m pytest -q \
            tests/test_fit_provenance.py \
            tests/test_ml_fit_source_witness_benchmark.py \
            tests/test_ml_lifecycle_observer.py \
            tests/test_ml_lifecycle_benchmark.py \
            tests/test_public_framework_api.py \
            tests/test_observer_no_cyclic_dependency.py
      - name: Execute measured fit-witness comparison
        run: python -m experiments.ml_fit_source_witness_benchmark > fit_witness_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: witnessed-fit-benchmark-${{ matrix.python-version }}
          path: fit_witness_benchmark.json
      - name: Ruff
        run: |
          ruff check \
            framework/fuzzyxai/fuzzyxai/fit_provenance.py \
            framework/fuzzyxai/fuzzyxai/ml_observer.py \
            tests/test_fit_provenance.py \
            tests/test_ml_fit_source_witness_benchmark.py \
            experiments/ml_fit_source_witness_benchmark.py \
            tests/test_ml_lifecycle_observer.py \
            tests/test_ml_lifecycle_benchmark.py
