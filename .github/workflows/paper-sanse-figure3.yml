name: SANSE Figure 3 unweighted reconstruction

on:
  push:
    branches:
      - research/manuscript-shacl-independent-20261113
    paths:
      - "experiments/paper_sanse/**"
      - ".github/workflows/paper-sanse-figure3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Recompute all unweighted published Figure 3 metrics
        run: python experiments/paper_sanse/recheck_figure3.py > sanse_figure3_result.json
      - name: Verify scope, 47 rows, exact source-object MI, negative control and tie sensitivity
        run: |
          python -c "import json; r=json.load(open('sanse_figure3_result.json')); assert r['n_entries']==47; assert abs(r['mutual_information_bits']['source_obj']-.1633)<.00005; assert r['collision_pairs']['source+obj+audience']==45; assert r['loo_audience_tie_rule_sensitivity']=={'abstain':15,'alphabetical':17,'global':23}; assert r['negative_control_50000']['observed_gain']==35"
      - uses: actions/upload-artifact@v4
        with:
          name: sanse-figure3-${{ matrix.python-version }}
          path: sanse_figure3_result.json
