name: ML witnessed-output evidence regression

on:
  push:
    branches:
      - research/ml-output-call-witness-20261112
  pull_request:
    paths:
      - "framework/fuzzyxai/fuzzyxai/output_provenance.py"
      - "framework/fuzzyxai/fuzzyxai/ml_observer.py"
      - "tests/test_ml_output_provenance.py"
      - ".github/workflows/ml-output-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-output-witness-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install framework and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Regression of ML observer and public APIs
        run: |
          python -m pytest -q \
            tests/test_ml_output_provenance.py \
            tests/test_ml_target_fit_witness.py \
            tests/test_ml_target_fit_benchmark.py \
            tests/test_fit_provenance.py \
            tests/test_ml_fit_source_witness_benchmark.py \
            tests/test_ml_lifecycle_observer.py \
            tests/test_ml_lifecycle_benchmark.py \
            tests/test_public_framework_api.py \
            tests/test_observer_no_cyclic_dependency.py
      - name: Lint read-only observer
        run: |
          ruff check framework/fuzzyxai/fuzzyxai/output_provenance.py \
            framework/fuzzyxai/fuzzyxai/ml_observer.py \
            tests/test_ml_output_provenance.py
