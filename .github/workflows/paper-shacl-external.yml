name: Paper RDF SHACL independent engine crosscheck

on:
  push:
    branches:
      - research/manuscript-shacl-independent-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent_validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install third-party SHACL validator
        run: python -m pip install 'pyshacl>=0.29,<0.32'
      - name: Revalidate submitted 24 RDF manuscript scenarios
        run: |
          python experiments/paper_shacl/verify_external_engine.py > independent_shacl_result.json
          python -c 'import json; p=json.load(open("independent_shacl_result.json")); assert p["n_cases"]==24 and p["valid_accepted"]==8 and p["known_faults_detected"]==16 and p["missed_known_faults"]==0'
      - name: Export machine-readable independent crosscheck
        uses: actions/upload-artifact@v4
        with:
          name: paper-shacl-${{ matrix.python-version }}
          path: independent_shacl_result.json
