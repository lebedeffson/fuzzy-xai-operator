name: ML witnessed-target evidence regression

on:
  push:
    branches:
      - research/ml-target-witness-20261112
  pull_request:
    paths:
      - "framework/fuzzyxai/fuzzyxai/fit_provenance.py"
      - "framework/fuzzyxai/fuzzyxai/ml_observer.py"
      - "tests/test_ml_target_fit_witness.py"
      - "tests/test_ml_target_fit_benchmark.py"
      - "experiments/ml_target_witness_postdev_benchmark.py"
      - "experiments/ml_target_witness_postdev_protocol_v1.json"
      - ".github/workflows/ml-target-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witnessed-target-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development requirements
        run: python -m pip install -e ".[dev]"
      - name: Regression for target, fit, model, and public APIs
        run: |
          python -m pytest -q \
            tests/test_ml_target_fit_witness.py \
            tests/test_ml_target_fit_benchmark.py \
            tests/test_fit_provenance.py \
            tests/test_ml_fit_source_witness_benchmark.py \
            tests/test_ml_lifecycle_observer.py \
            tests/test_ml_lifecycle_benchmark.py \
            tests/test_public_framework_api.py \
            tests/test_observer_no_cyclic_dependency.py
      - name: Run new-data target witness experiment
        run: python -m experiments.ml_target_witness_postdev_benchmark > target_witness_benchmark.json
      - name: Upload developmental experiment results
        uses: actions/upload-artifact@v4
        with:
          name: target-witness-benchmark-__PYTHON__
          path: target_witness_benchmark.json
      - name: Ruff
        run: |
          ruff check \
            framework/fuzzyxai/fuzzyxai/fit_provenance.py \
            framework/fuzzyxai/fuzzyxai/ml_observer.py \
            tests/test_ml_target_fit_witness.py \
            tests/test_ml_target_fit_benchmark.py \
            experiments/ml_target_witness_postdev_benchmark.py \
            tests/test_fit_provenance.py
