plan_id: ch6_papila_glaucoma_system
plan_version: 1.0.0
dataset_scope: [papila_figshare_14798004_v2]
modality: fundus_rgb
required_sources: [input_identity, preprocessing_trace, model_checkpoint, full_probabilities, lime, grad_cam, technical_trace]
optional_sources: [integrated_gradients, expert_segmentation_1, expert_segmentation_2, clinical_metadata, training_history]
not_applicable_rules: [native_fuzzy_rules]
beta: {repr: 0.30, rules: 0.25, activations: 0.15, uncertainty: 0.20, trace: 0.10}
lambda: {H: 0.20, C: 0.20, O: 0.20, K: 0.20, U: 0.20}
eta: {model: 0.70, rules: 0.00, trace: 0.30}
i_min: 0.50
activation_threshold: 0.05
gamma_warning: 0.25
gamma_critical: 0.60
delta_warning: 0.25
delta_critical: 0.60
rho_accept: 0.35
rho_warning: 0.60
rho_audit: 0.75
rho_critical: 0.85
representation_policy: technical_glaucoma_probability_coordinate
action_policy: risk_zone
uncertainty_policy:
  method: entropy
  source: binary glaucoma probability vector
uncertainty_representation_policy:
  method: vote_probability_plus_minus_dispersion
  scale: 1.0
  clip: [0.0, 1.0]
  source: declared heuristic interval; not calibrated prediction interval
reduction_policy:
  applicable: false
  method: none
  source: full spatial attribution Pi/iota unsupported by frozen P19 public contract
alignment_policy:
  applicable: true
  source: registered binary glaucoma probability to technical risk membership transform
  transform:
    transform_id: ch6_papila_glaucoma_probability_to_technical_risk_v1
    source_interface: glaucoma_probability
    target_interface: technical_risk
    term_mapping:
      glaucoma_probability:class:0: risk:low
      glaucoma_probability:class:1: risk:high
    rule_mapping:
      source_class_0: target_low
      source_class_1: target_high
    representation_mapping: risk_membership_partition
    uncertainty_mapping: identity
    trace_mapping: identity
    parameters:
      triangles: {low: [0.0, 0.0, 0.5], medium: [0.0, 0.5, 1.0], high: [0.5, 1.0, 1.0]}
      registered_coordinate: probability_of_glaucoma
    source_refs: [configs/explain_plan_papila.yaml]
    limitations: [Technical risk coordinate is P(glaucoma) for this experiment, not a clinical decision score.]
membership_policies:
  system_risk:
    variable: technical_risk
    universe: [0.0, 1.0]
    origin: preset
    version: ch6-papila-v1
    calibration_reference: technical demonstration only
    terms:
      - {label: low, function: triangular, parameters: [0.0, 0.0, 0.5]}
      - {label: medium, function: triangular, parameters: [0.0, 0.5, 1.0]}
      - {label: high, function: triangular, parameters: [0.5, 1.0, 1.0]}
metadata:
  system_risk_weights: {w_p: 0.30, w_u: 0.25, w_I: 0.20, w_Delta: 0.00, w_R: 0.25}
  system_risk_thresholds: {theta_1: 0.35, theta_2: 0.60, theta_3: 0.75, theta_4: 0.85}
  system_action_policy: {theta_2_to_theta_3: request_more_data, theta_3_to_theta_4: defer_to_human}
  system_target_consequents: {low: technical_low, medium: technical_medium, high: technical_high}
  declared_coordinate: probability_of_glaucoma
  clinical_thresholds: false
  gamma_scope: canonical FuzzyXAI system alignment; not native-XAI-to-XAI agreement
domain_language:
  classes:
    "0": {label: здоровый глаз}
    "1": {label: глаукома}
  features: {}
  actions:
    accept: {label: технический маршрут принят}
    lower_confidence: {label: понизить доверие}
    request_more_data: {label: запросить дополнительные сведения}
    defer_to_human: {label: передать специалисту}
    block: {label: заблокировать автоматическое применение}
