[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzyxai-operator"
version = "1.4.0a2"
description = "Evidence-first framework for auditing, diagnosing, repairing, and recertifying ML/XAI pipelines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "plotly>=5.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.scripts]
fuzzyxai = "fuzzyxai.cli:main"

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.2"]
xgboost = ["xgboost>=1.7"]
lightgbm = ["lightgbm>=4.0"]
catboost = ["catboost>=1.2"]
torch = ["torch>=2.1"]
tensorflow = ["tensorflow>=2.14"]
onnx = ["onnx>=1.15", "onnxruntime>=1.16"]
images = ["pillow>=10.0"]
evidence = ["pyarrow>=16.0"]
# Not imported anywhere under fuzzyxai/ (the installable package) — only by
# the standalone apps/*.py dashboards at the repo root, which are not
# shipped in the wheel. Kept as an extra so a plain `pip install
# fuzzyxai-operator` doesn't pull in a UI framework nothing in the package uses.
ui = ["nicegui>=1.4"]
mlflow = ["mlflow==2.22.5"]
ml-vertical = [
    "shap==0.51.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mlflow==2.22.5",
]
all-models = [
    "xgboost>=1.7",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "torch>=2.1",
    "tensorflow>=2.14",
    "onnx>=1.15",
    "onnxruntime>=1.16",
    "pillow>=10.0",
]
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
    "playwright>=1.40",
    "build>=1.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyarrow>=16.0",
    "shap==0.51.0",
]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "skip"
files = [
    "framework/fuzzyxai/fuzzyxai/adapters/model.py",
    "framework/fuzzyxai/fuzzyxai/adapters/contracts_v2.py",
    "framework/fuzzyxai/fuzzyxai/adapters/model_v2.py",
    "framework/fuzzyxai/fuzzyxai/adapters/model_registry.py",
    "framework/fuzzyxai/fuzzyxai/adapters/sklearn_v2.py",
    "framework/fuzzyxai/fuzzyxai/adapter_conformance.py",
    "framework/fuzzyxai/fuzzyxai/planner.py",
    "framework/fuzzyxai/fuzzyxai/explanation_quality.py",
    "framework/fuzzyxai/fuzzyxai/evidence/contracts.py",
    "framework/fuzzyxai/fuzzyxai/evidence/human.py",
    "framework/fuzzyxai/fuzzyxai/visualization/spec.py",
    "framework/fuzzyxai/fuzzyxai/selective_observer/baselines.py",
    "framework/fuzzyxai/fuzzyxai/selective_observer/contracts.py",
    "framework/fuzzyxai/fuzzyxai/selective_observer/controller.py",
    "framework/fuzzyxai/fuzzyxai/selective_observer/route_validity.py",
    "framework/fuzzyxai/fuzzyxai/selective_observer/rule_validation.py",
]

[tool.setuptools]
package-dir = {"" = "framework/fuzzyxai"}

[tool.setuptools.packages.find]
where = ["framework/fuzzyxai"]
include = ["fuzzyxai*"]
# P13 packaging audit: each excluded subpackage was verified, not guessed —
# via `python -c "import fuzzyxai; ...; sys.modules"` after exercising the
# full canonical surface (wrap/explain_one/explain/diagnose/why_not/audit/
# quality_report/capability_report/export_html/explain_global/
# observe_training/compare_models/verbalize/visualize), cross-checked
# against exact absolute-import greps (not name-based guessing — several
# candidates that *looked* research-only, e.g. fuzzyxai.data and
# fuzzyxai.audit_h10, turned out to be hard transitive dependencies of
# fuzzyxai/__init__.py and were kept). Every name below was confirmed to
# have zero real importers anywhere in the kept runtime surface.
# fuzzyxai.experiments / fuzzyxai.q1_validation are dissertation-study code
# (h10_c*, chapter2/3 calibration scripts, Q1 validation protocols).
# The rest are dissertation-chapter-specific research/formal-methods
# packages (ai_pre_review*: blind AI review study; audit: release-readiness
# CI checks, distinct from the kept fuzzyxai.audit_h10; calibration/
# category/hott: chapter-specific formal frameworks; ecosystem/evaluate/
# evidence_path/final_closure/gold_repository/incidents/multimodal/
# q1_final/repository_diagnostics/robustness/strong_confirmatory: H9/H10/Q1
# study evidence generators; config: unused defaults registry; practice/
# realdata/repair/reporting/roles/studio/train/viz: doctoral-demo and
# defense-case tooling) — none referenced by fuzzyxai/__init__.py or any of
# its transitive imports.
exclude = [
    "fuzzyxai.experiments", "fuzzyxai.experiments.*",
    "fuzzyxai.q1_validation", "fuzzyxai.q1_validation.*",
    "fuzzyxai.ai_pre_review", "fuzzyxai.ai_pre_review.*",
    "fuzzyxai.ai_pre_review_final", "fuzzyxai.ai_pre_review_final.*",
    "fuzzyxai.audit", "fuzzyxai.audit.*",
    "fuzzyxai.calibration", "fuzzyxai.calibration.*",
    "fuzzyxai.category", "fuzzyxai.category.*",
    "fuzzyxai.config", "fuzzyxai.config.*",
    "fuzzyxai.ecosystem", "fuzzyxai.ecosystem.*",
    "fuzzyxai.evaluate", "fuzzyxai.evaluate.*",
    "fuzzyxai.evidence_path", "fuzzyxai.evidence_path.*",
    "fuzzyxai.final_closure", "fuzzyxai.final_closure.*",
    "fuzzyxai.gold_repository", "fuzzyxai.gold_repository.*",
    "fuzzyxai.hott", "fuzzyxai.hott.*",
    "fuzzyxai.incidents", "fuzzyxai.incidents.*",
    "fuzzyxai.multimodal", "fuzzyxai.multimodal.*",
    "fuzzyxai.practice", "fuzzyxai.practice.*",
    "fuzzyxai.q1_final", "fuzzyxai.q1_final.*",
    "fuzzyxai.realdata", "fuzzyxai.realdata.*",
    "fuzzyxai.repair", "fuzzyxai.repair.*",
    "fuzzyxai.reporting", "fuzzyxai.reporting.*",
    "fuzzyxai.repository_diagnostics", "fuzzyxai.repository_diagnostics.*",
    "fuzzyxai.robustness", "fuzzyxai.robustness.*",
    "fuzzyxai.roles", "fuzzyxai.roles.*",
    "fuzzyxai.strong_confirmatory", "fuzzyxai.strong_confirmatory.*",
    "fuzzyxai.studio", "fuzzyxai.studio.*",
    "fuzzyxai.train", "fuzzyxai.train.*",
    "fuzzyxai.viz", "fuzzyxai.viz.*",
]

[tool.setuptools.package-data]
fuzzyxai = ["schemas/*.json"]

[tool.setuptools.data-files]
"share/fuzzyxai/matlab/+fuzzyxai" = ["framework/fuzzyxai/matlab/+fuzzyxai/*.m"]
