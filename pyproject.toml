[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzyxai-operator"
version = "1.2.0rc2"
description = "FuzzyXAI operator engine, Studio, proof package, and doctoral readiness audit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "plotly>=5.0",
  "matplotlib>=3.7",
  "nicegui>=1.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "playwright>=1.40",
    "build>=1.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "skip"
files = [
    "framework/fuzzyxai/fuzzyxai/adapters/model.py",
    "framework/fuzzyxai/fuzzyxai/evidence/contracts.py",
    "framework/fuzzyxai/fuzzyxai/evidence/human.py",
    "framework/fuzzyxai/fuzzyxai/visualization/spec.py",
]

[tool.setuptools]
package-dir = {"" = "framework/fuzzyxai"}

[tool.setuptools.packages.find]
where = ["framework/fuzzyxai"]
include = ["fuzzyxai*"]

[tool.setuptools.package-data]
fuzzyxai = ["schemas/*.json"]

[tool.setuptools.data-files]
"share/fuzzyxai/matlab/+fuzzyxai" = ["framework/fuzzyxai/matlab/+fuzzyxai/*.m"]
