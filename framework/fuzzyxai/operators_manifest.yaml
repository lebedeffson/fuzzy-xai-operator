schema_version: "1.0"
operators:
  - id: ch2.explain_plan
    dissertation_ref: "chapter 2, ExplainPlan contract"
    callable: fuzzyxai.core.explain_plan:ExplainPlan
    input_schema: ExplainPlanMapping
    output_schema: ExplainPlan
    tests: [tests/test_explain_plan_contract.py]
    artifacts: [reports/chapter2/explain_plan_hash.json]
    visualization: []
  - id: ch2.explanation_object
    dissertation_ref: "chapter 2, E_k"
    callable: fuzzyxai.core.explanation_object:ExplanationObject
    input_schema: ExplanationComponents
    output_schema: ExplanationObject
    tests: [tests/test_operator_trace.py]
    artifacts: [reports/chapter2/sample_113_report.json]
    visualization: [operator_route]
  - id: ch2.system_operator
    dissertation_ref: "chapter 2, system operator"
    callable: fuzzyxai.core.system_operator:SystemOperator
    input_schema: ModelSignal
    output_schema: ExplanationObject
    tests: [tests/test_operator_trace.py]
    artifacts: [reports/chapter2/sample_113_table.csv]
    visualization: [membership_panel]
  - id: ch2.semantic_disagreement
    dissertation_ref: "chapter 2, formula 2.30"
    callable: fuzzyxai.core.trust_evaluator:semantic_disagreement
    input_schema: ExplanationPair
    output_schema: float
    tests: [tests/test_semantic_disagreement_pseudometric.py]
    artifacts: [reports/chapter2/equal_raw_structure_report.json]
    visualization: [gamma_delta_heatmap]
  - id: ch2.alignment_synthesis
    dissertation_ref: "chapter 2, algorithm 2.2"
    callable: fuzzyxai.core.alignment_synthesis:synthesize_alignment
    input_schema: AlignmentSynthesisInput
    output_schema: AlignmentResultOrDiagnosticState
    tests: [tests/test_alignment_synthesis.py]
    artifacts: [reports/chapter2/alignment_synthesis_report.json]
    visualization: [operator_route]
  - id: ch2.interpretability_loss
    dissertation_ref: "chapter 2, L(E) and I(E_G)"
    callable: fuzzyxai.core.trust_evaluator:interpretability_loss
    input_schema: InterpretabilityComponents
    output_schema: float
    tests: [tests/test_trust.py]
    artifacts: [reports/chapter2/chapter2_breast_cancer_summary.json]
    visualization: [gamma_delta_heatmap]
  - id: ch2.calibration
    dissertation_ref: "chapter 2, calibration constants"
    callable: fuzzyxai.experiments.chapter2_calibration:run
    input_schema: CalibrationRun
    output_schema: CalibrationReport
    tests: [tests/test_chapter2_chapter3_artifacts.py]
    artifacts: [reports/chapter2/calibration_report.json]
    visualization: [calibration_constants]
  - id: ch2.equal_raw_structure
    dissertation_ref: "chapter 2, equal raw structure benchmark"
    callable: fuzzyxai.experiments.chapter2_equal_raw_structure:run
    input_schema: BenchmarkRun
    output_schema: BenchmarkReport
    tests: [tests/test_chapter2_chapter3_artifacts.py]
    artifacts: [reports/chapter2/equal_raw_structure_summary.csv]
    visualization: [baseline_comparison]
  - id: ch3.representation_hierarchy
    dissertation_ref: "chapter 3, F0/F_int/F_H/F_N/F_ML"
    callable: fuzzyxai.hierarchy.reductions:reduce_to_f0
    input_schema: FuzzyRepresentation
    output_schema: F0
    tests: [tests/test_reductions.py]
    artifacts: [dissertation_artifacts/diagram_specs/chapter3/fig_3_2_hierarchy.json]
    visualization: [representation_atlas]
  - id: ch3.reduction_loss
    dissertation_ref: "chapter 3, Delta"
    callable: fuzzyxai.hierarchy.reductions:reduction_loss
    input_schema: ReductionPair
    output_schema: float
    tests: [tests/test_reduction_approximation_theorem.py]
    artifacts: [dissertation_artifacts/diagram_specs/chapter3/fig_3_3_reduction.json]
    visualization: [gamma_delta_heatmap]
  - id: ch3.pareto_selection
    dissertation_ref: "chapter 3, algorithm 3.1"
    callable: fuzzyxai.selection.pareto_selector:select_minimal_sufficient
    input_schema: SituationProfileAndCandidates
    output_schema: CandidateOrChoiceDiagnostic
    tests: [tests/test_selector.py]
    artifacts: [reports/chapter3/dataset_roles_summary.csv]
    visualization: [representation_atlas]
  - id: ch3.context_acceptance
    dissertation_ref: "chapter 3, chi_Auto"
    callable: fuzzyxai.risk.context_acceptance:observer_auto_accept_allowed
    input_schema: ContextAcceptanceInput
    output_schema: bool
    tests: [tests/test_characteristic_morphism_auto.py]
    artifacts: [dissertation_artifacts/diagram_specs/chapter3/fig_3_8_chi_auto_sample113.json]
    visualization: [action_boundary]
  - id: ch3.certified_path
    dissertation_ref: "chapter 3, CertifiedPath and Rupture"
    callable: fuzzyxai.category.certified_path:CertifiedPath
    input_schema: CertifiedEdges
    output_schema: CertifiedPath
    tests: [tests/test_certified_path_category.py]
    artifacts: [dissertation_artifacts/diagram_specs/chapter3/fig_3_4_route.json]
    visualization: [operator_route]
  - id: ch3.risk_action
    dissertation_ref: "chapter 3, formulas 3.42 and 3.44"
    callable: fuzzyxai.core.risk_observer:observe_risk
    input_schema: RiskInput
    output_schema: RiskResult
    tests: [tests/test_critical_rupture_blocks.py]
    artifacts: [reports/chapter3/synthetic_ruptures_summary.json]
    visualization: [risk_waterfall]
  - id: ch3.controlled_critical_ruptures
    dissertation_ref: "chapter 3, diagnostic stand"
    callable: fuzzyxai.experiments.chapter3_critical_ruptures:run
    input_schema: CriticalRuptureRun
    output_schema: CriticalRuptureReport
    tests: [tests/test_chapter3_critical_ruptures.py]
    artifacts: [reports/chapter3/synthetic_ruptures_results.csv]
    visualization: [critical_ruptures_comparison]
