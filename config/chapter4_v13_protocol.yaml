protocol:
  id: FXAI-CHAPTER4-PRACTICAL-V13
  version: 1
  phase: frozen_before_test_execution
  created_at_utc: "2026-07-21T22:45:00Z"
  base_release:
    tag: v1.3.0
    commit: 1a71bae98f1554430d537670018dce7dc889e25f
  branch: experiments/chapter4-practical-v13
  immutable_after_commit: true

scope:
  primary_goal: >-
    Measure practical integration, matched-coverage policy behavior, typed route
    validation, and complete runtime for one modern pretrained text contour.
  frozen_negative_claims:
    H3-original: not_supported
    H5-P-original: not_supported
    H6-general: not_supported
  forbidden_claims:
    - universal policy superiority
    - improved domain safety
    - validated user comprehension
    - end-to-end scaling to five million objects
    - detection of arbitrary unknown route faults

modern_contour:
  modality: text
  dataset:
    id: fancyzhx/ag_news
    revision: eb185aade064a813bc0b7f42de02595523103ca4
    source: https://huggingface.co/datasets/fancyzhx/ag_news
    source_train_size: 120000
    source_test_size: 7600
    labels: [World, Sports, Business, Sci_Tech]
    license_status: unknown_in_upstream_dataset_card
    redistribution: forbidden_in_release_bundle
  split:
    train: 100000
    validation: 20000
    sealed_test: 7600
    train_validation_source: official_train
    sealed_test_source: official_test
    stratified: true
    duplicate_key: normalized_text_sha256
  model:
    id: textattack/distilbert-base-uncased-ag-news
    revision: 52ee64de95f38323f136c6f6b05e1af7c433417e
    architecture: DistilBERT sequence classifier
    weights: frozen_pretrained
    training: none
    source: https://huggingface.co/textattack/distilbert-base-uncased-ag-news
  prediction:
    objects: 127600
    max_length: 128
    batch_size: 64
    mixed_precision: false
  explanations:
    selection: stratified_from_sealed_test
    objects: 2000
    objects_per_class: 500
    methods:
      integrated_gradients:
        steps: 16
        baseline: pad_token_with_special_tokens_preserved
        target: predicted_class
      token_masking:
        tokens_per_object: 20
        baseline: mask_token
        target: predicted_class
    top_k: 10
    stability:
      seeds: [1301, 1302, 1303, 1304, 1305]
      perturbations_per_object: 5
      perturbation: deterministic_nonsemantic_whitespace_and_punctuation

policy_evaluation:
  selection_data: validation_only
  scoring_data: sealed_test_only
  test_labels_allowed_only_in: scoring
  continuous_feature_channels:
    - one_minus_max_confidence
    - calibrated_error_risk
    - predictive_entropy
    - integrated_gradients_instability
    - token_masking_instability
    - explainer_disagreement
    - provenance_incompleteness
    - route_risk
  policies:
    - always_accept
    - max_confidence
    - calibrated_confidence
    - predictive_entropy
    - weighted_linear
    - explainer_disagreement
    - simple_or
    - provenance_only
    - predictive_risk_P0
    - full_fuzzyxai_P1
    - full_fuzzyxai
    - random_matched_budget
  review_budgets: [0.05, 0.10, 0.20, 0.30, 0.40]
  matched_coverage_required: true
  primary_budget: 0.20
  primary_endpoint: wrong_automatic_actions
  primary_comparison: full_fuzzyxai_vs_best_simple_validation_policy
  secondary_metrics:
    - automatic_coverage
    - accepted_error_rate
    - selective_risk
    - manual_review_load
    - false_blocks
    - true_structural_blocks
    - total_cost
    - risk_auroc
    - risk_auprc
    - expected_calibration_error
    - brier_score
  cost_profiles:
    balanced:
      wrong_accept: 10.0
      review: 1.0
      false_block: 4.0
    unsafe_accept_sensitive:
      wrong_accept: 25.0
      review: 1.0
      false_block: 5.0
    review_expensive:
      wrong_accept: 10.0
      review: 4.0
      false_block: 4.0

route_validation:
  development_groups: [registered_single, registered_compositional]
  held_out_group: held_out_fault_types
  methods:
    - simple_or
    - independent_if_else
    - weighted_fault_score
    - typed_route_validator
  registered_single:
    - missing_provenance
    - model_version_mismatch
    - preprocessing_incompatibility
    - corrupted_checksum
    - missing_calibration
  registered_compositional:
    minimum_faults: 2
    maximum_faults: 3
    combinations: all_deterministic_combinations
  held_out_fault_types:
    - reordered_transformations
    - unknown_dictionary_version
    - broken_post_reduction_link
    - mixed_model_artifacts
    - incompatible_feature_space
  samples_per_fault_type: 200
  clean_samples: 1000
  metrics:
    - precision
    - recall
    - f1
    - false_certification
    - false_rejection
    - fault_type_accuracy
    - component_localization_accuracy
    - diagnostic_time_ms
  unknown_fault_claim: detection_not_guaranteed

runtime_benchmark:
  sizes: [1, 10, 100, 1000]
  cheap_method_extra_size: 10000
  warmups: 1
  repetitions: 5
  components:
    - model
    - explainer
    - fuzzyxai
    - serialization
  metrics:
    - median_seconds
    - mean_seconds
    - standard_deviation_seconds
    - p95_seconds
    - p99_seconds
    - objects_per_second
    - peak_rss_bytes
    - peak_vram_bytes
  cached_operator_five_million: descriptive_separate_only

statistics:
  paired_bootstrap_repetitions: 5000
  confidence_level: 0.95
  multiple_comparisons: holm
  effect_sizes: [absolute_difference, relative_difference]
  aggregation_rule: aggregate_only_when_dataset_directions_agree
  seeds: [1301, 1302, 1303, 1304, 1305]

hypotheses:
  V13-H1:
    status: confirmatory
    statement: canonical explanation payloads are preserved byte-for-byte
    criterion: hash_preservation_rate_equals_1
  V13-H2:
    status: confirmatory
    statement: compare full FuzzyXAI with the validation-selected simple policy at matched coverage
    criterion: report_effect_without_required_positive_direction
  V13-H3:
    status: confirmatory
    statement: typed validation improves registered-fault localization over simple guardrails
    criterion: holm_adjusted_comparison_and_effect_size
  V13-H4:
    status: descriptive
    statement: decompose complete runtime into model, explainer, FuzzyXAI, and serialization
    criterion: five_repetitions_after_warmup
  V13-H5:
    status: exploratory
    statement: measure behavior on fault types withheld from validator development
    criterion: report_without_universal_unknown_fault_claim

exclusion_rules:
  allowed:
    - process_terminated_before_any_test_label_was_opened
    - corrupted_download_with_source_checksum_mismatch
    - hardware_out_of_memory_before_any_scored_artifact_was_written
  forbidden:
    - unfavorable_result
    - low_model_accuracy
    - weak_fuzzyxai_policy
    - failed_held_out_fault_detection
  failed_runs_remain_logged: true

leakage_controls:
  - zero_train_validation_test_id_overlap
  - zero_normalized_text_duplicate_overlap
  - no_test_labels_in_policy_features
  - thresholds_selected_on_validation_only
  - best_simple_baseline_selected_on_validation_only
  - policy_frozen_before_test_scoring
  - tokenizer_and_normalization_fitted_without_test_labels
  - explainer_background_uses_train_only
  - ids_and_hashes_persisted

environment:
  operating_system: Arch_Linux_x86_64
  kernel: 7.1.3-arch2-2
  python: "3.12"
  cpu_threads_available: 16
  ram_bytes: 15575629824
  gpu: NVIDIA_GeForce_RTX_4060_Laptop_GPU
  vram_bytes: 8587837440
  gpu_driver: 610.43.03
  runtime_threads: 8
  deterministic_algorithms: true

artifacts:
  root: artifacts/chapter4_v13
  raw_results_format: jsonl
  summary_format: json
  tables_format: csv
  evidence_map: artifacts/chapter4_v13/evidence_map.json
  leakage_audit: artifacts/chapter4_v13/leakage_audit.json
  validation_report: artifacts/chapter4_v13/validation_report.md
  every_numeric_claim_requires:
    - source_artifact
    - builder_script
    - config
    - commit
    - sha256
    - evidence_map_entry
    - evidence_status

chapter_update:
  source_docx: Глава_4_FuzzyXAI_финальная_сдаваемая_редакция_v12.docx
  permitted_only_after:
    - protocol_hash_verified
    - modern_contour_complete
    - policy_results_frozen
    - route_results_frozen
    - runtime_results_frozen
    - leakage_audit_passed
    - evidence_map_validated
